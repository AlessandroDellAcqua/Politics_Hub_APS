<section class="page-hero">
  <div class="container">
    <h1>Iscrizione all'evento</h1>
    <p>Fino a 2 partecipanti per iscrizione. I biglietti con il QR code arrivano via email entro pochi minuti.</p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:760px">
    <div id="ph-reg-event">
      <noscript><p>Attiva JavaScript per iscriverti all'evento.</p></noscript>
    </div>

    <form id="ph-reg-form" class="ph-form hide" novalidate>
      <input type="hidden" name="event_id" value="">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="reg-guests">
        <h3>Partecipante 1</h3>
        <div class="form-row">
          <div><label for="reg-n1">Nome *</label><input type="text" id="reg-n1" name="nome1" required autocomplete="given-name"></div>
          <div><label for="reg-c1">Cognome *</label><input type="text" id="reg-c1" name="cognome1" required autocomplete="family-name"></div>
        </div>
      </div>

      <label class="check-row" style="margin-top:20px">
        <input type="checkbox" id="reg-add-guest2">
        <span>Aggiungo un secondo partecipante (max 2 biglietti per iscrizione)</span>
      </label>

      <div class="reg-guests hide" id="reg-guest2">
        <h3>Partecipante 2</h3>
        <div class="form-row">
          <div><label for="reg-n2">Nome</label><input type="text" id="reg-n2" name="nome2"></div>
          <div><label for="reg-c2">Cognome</label><input type="text" id="reg-c2" name="cognome2"></div>
        </div>
      </div>

      <label for="reg-email">Email (qui arrivano i biglietti) *</label>
      <input type="email" id="reg-email" name="email" required autocomplete="email">

      <label class="check-row">
        <input type="checkbox" name="consent" required>
        <span>Ho letto e accetto la <a href="privacy-eventi.html" target="_blank">Privacy Policy eventi</a>. *</span>
      </label>

      <button class="btn btn-primary" type="submit">Iscrivimi</button>
    </form>

    <div id="ph-reg-status" class="form-status" aria-live="polite"></div>
  </div>
</section>
